name: Verify SheetNest
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml spotless:check test package
      - run: npm ci --no-audit --no-fund && npm run format:check && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: python3 scripts/init-env.py && docker compose config --quiet && python3 scripts/release-check.py && git diff --check
