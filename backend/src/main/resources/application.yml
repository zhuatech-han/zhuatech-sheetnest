spring:
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://mysql:3306/zhuatech_sheetnest?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLocalInfile=false&sslMode=trust&useMysqlMetadata=true&useCatalogTerm=CATALOG}
    username: ${DATABASE_USER:sheetnest}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate.globally_quoted_identifiers: true
      hibernate.globally_quoted_identifiers_skip_column_definitions: true
      hibernate.default_catalog: "`${DATABASE_CATALOG:zhuatech_sheetnest}`"
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
sheetnest:
  admin-password: ${ADMIN_PASSWORD}
logging:
  level:
    org.hibernate.orm.connections.pooling: "OFF"
